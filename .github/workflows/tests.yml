---
name: Community tests

on:
  push:
    branches:
      - main
      - feat/community-oidc
      - feat/family-setup
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  community:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4.4.0
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: zentral_test
          POSTGRES_DB: zentral_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zentral_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the community runtime
        run: docker build --build-arg APP_ENV=community -t zentral-community:test .
      - name: Verify image boundaries and community behavior
        run: |
          docker run --rm --entrypoint sh zentral-community:test -c 'test ! -e /zentral/ee'
          docker run --rm --network host --entrypoint python \
            -v "$PWD/tests:/zentral/tests:ro" \
            -e ZENTRAL_CONF_DIR=/zentral/tests/community_conf \
            -e POSTGRES_HOST=127.0.0.1 -e POSTGRES_PORT=5432 -e POSTGRES_USER=zentral_test \
            -e ZENTRAL_POLICIES_SYNC=0 -e ZENTRAL_PROBES_SYNC=0 \
            -e ZENTRAL_STORES_SYNC=0 -e ZENTRAL_QUIET=1 \
            zentral-community:test server/manage.py test \
            tests.server_accounts.test_community_oidc \
            tests.server_accounts.test_auth_backend \
            tests.server_base.test_telemetry \
            tests.server_base.test_community_runtime
      - name: Verify control queues and task execution against RabbitMQ
        run: |
          docker run --rm --network host --entrypoint python \
            -v "$PWD/tests:/zentral/tests:ro" \
            -e ZENTRAL_CONF_DIR=/zentral/tests/community_conf \
            -e POSTGRES_HOST=127.0.0.1 -e POSTGRES_PORT=5432 -e POSTGRES_USER=zentral_test \
            -e CELERY_BROKER_URL=amqp://127.0.0.1:5672// \
            -e ZENTRAL_POLICIES_SYNC=0 -e ZENTRAL_PROBES_SYNC=0 \
            -e ZENTRAL_STORES_SYNC=0 -e ZENTRAL_QUIET=1 \
            zentral-community:test tests/community_worker_smoke.py
      - name: Verify community MDM authentication and push workers
        run: |
          docker run --rm --network host --entrypoint python \
            -v "$PWD/tests:/zentral/tests:ro" \
            -v "$PWD/conf/start/docker/tls:/zentral/conf/start/docker/tls:ro" \
            -e ZENTRAL_CONF_DIR=/zentral/tests/community_mdm_conf \
            -e POSTGRES_HOST=127.0.0.1 -e POSTGRES_PORT=5432 -e POSTGRES_USER=zentral_test \
            -e POSTGRES_NAME=zentral_mdm_test \
            -e ZENTRAL_FORCE_ES_OS_INDEX_REFRESH=1 \
            -e ZENTRAL_POLICIES_SYNC=0 -e ZENTRAL_PROBES_SYNC=0 \
            -e ZENTRAL_STORES_SYNC=0 -e ZENTRAL_QUIET=1 \
            zentral-community:test server/manage.py test \
            tests.mdm.test_crypto tests.mdm.test_mdm_views tests.mdm.test_ota_enrollment \
            tests.mdm.test_apns tests.mdm.test_workers tests.mdm.test_apns_telemetry \
            tests.mdm.test_scep_broker tests.mdm.test_scep_proxy tests.mdm.test_provision_ota_enrollment \
            tests.mdm.test_dep tests.mdm.test_setup_dep_enrollment tests.mdm.test_api_dep_enrollment_views \
            tests.mdm.test_api_enrolled_devices_views \
            tests.mdm.test_family_setup
      - name: Build the manual SCEP integration probe
        working-directory: tests/scep_smoke
        run: |
          go test ./...
          go vet ./...
          go build -o "$RUNNER_TEMP/zentral-scep-smoke" .
      - name: Verify browser privacy filtering
        run: |
          npm ci
          node --test tests/browser-telemetry.test.mjs
